# Har bir yangilanishda avtomatik testlar. Railway'da «Wait for CI» yoqilgan bo'lsa,
# testlar o'tmaguncha yangi versiya ishga chiqmaydi — eski versiya ishlashda davom etadi.
name: Testlar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit + E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Kutubxonalar
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: Unit testlar (mavzular, pul himoyasi, menyu, xatolar)
        run: npm run test:unit

      - name: Build
        run: npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Playwright (Chromium)
        run: |
          pip install playwright==1.56.0 pillow
          python -m playwright install --with-deps chromium

      - name: E2E testlar (haqiqiy server + brauzer)
        # Testlar Toshkent vaqtida yozilgan (brauzer ham Asia/Tashkent) — UTC'da 19:00–24:00 oralig'ida
        # «bugun» sanasi bir kunga farq qilib, vazifa testlari yiqilardi
        env:
          TZ: Asia/Tashkent
        run: npm run test:e2e

      - name: Xato bo'lsa — rasmlar va server logi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-natijalar
          path: tests/e2e/out/
          retention-days: 7
